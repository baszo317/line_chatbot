<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高明補習班後台</title>
<style>
:root {
  --sans: "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Heiti TC", system-ui, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  --paper: #f5f6f7; --card: #ffffff; --sunk: #f0f2f4; --hover: #f5f7f8;
  --ink: #1f2328; --ink-2: #3b4148; --muted: #646b74; --faint: #949ba3;
  --line: #e1e4e8; --line-2: #cbd0d6;
  --accent: #1e5e4a; --accent-ink: #ffffff; --accent-weak: #e4eee9;
  --bar: #1f3b33; --bar-ink: #c9dad3; --bar-on: #ffffff; --bar-mark: #8fd0b5;
  --red: #b42318; --red-weak: #fcebe9; --amber: #8f5408; --amber-weak: #fbf0dc; --green: #1d7442;
  --g6: #456aa8; --g7: #357e55; --g8: #a5611f; --g9: #973d5f; --g0: #6b7280;
  --chat: #d9e2ec; --me: #9be15d;
  --shadow: 0 12px 36px rgba(20, 28, 36, .22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171a; --card: #1b1f23; --sunk: #171a1d; --hover: #21262b;
    --ink: #e3e7eb; --ink-2: #c6ccd2; --muted: #98a0a8; --faint: #6f777f;
    --line: #2b3137; --line-2: #3b434b;
    --accent: #7cc4a8; --accent-ink: #0f1d18; --accent-weak: #1c2e27;
    --bar: #15241e; --bar-ink: #a9c0b6; --bar-on: #ffffff; --bar-mark: #7cc4a8;
    --red: #f08a7e; --red-weak: #3a1f1c; --amber: #e0ad62; --amber-weak: #33270f; --green: #74c99a;
    --g6: #86a8e0; --g7: #74c39a; --g8: #e0a564; --g9: #e08daf; --g0: #9aa3ad;
    --chat: #24303c; --me: #4f8a3a; --shadow: 0 12px 36px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171a; --card: #1b1f23; --sunk: #171a1d; --hover: #21262b;
  --ink: #e3e7eb; --ink-2: #c6ccd2; --muted: #98a0a8; --faint: #6f777f;
  --line: #2b3137; --line-2: #3b434b;
  --accent: #7cc4a8; --accent-ink: #0f1d18; --accent-weak: #1c2e27;
  --bar: #15241e; --bar-ink: #a9c0b6; --bar-on: #ffffff; --bar-mark: #7cc4a8;
  --red: #f08a7e; --red-weak: #3a1f1c; --amber: #e0ad62; --amber-weak: #33270f; --green: #74c99a;
  --g6: #86a8e0; --g7: #74c39a; --g8: #e0a564; --g9: #e08daf; --g0: #9aa3ad;
  --chat: #24303c; --me: #4f8a3a; --shadow: 0 12px 36px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.6 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.st-red { color: var(--red); }
.st-amber { color: var(--amber); }
.st-green { color: var(--green); }

/* 上方的選單 */
.top { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; align-items: stretch; gap: 20px; height: 48px; }
.brand { color: var(--bar-on); font-weight: 700; font-size: 16px; letter-spacing: .08em; display: flex; align-items: center; white-space: nowrap; text-decoration: none; }
nav { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav a { display: flex; align-items: center; gap: 6px; padding: 0 11px; color: var(--bar-ink); text-decoration: none; white-space: nowrap;
        border-top: 3px solid transparent; border-bottom: 3px solid transparent; }
nav a:hover { color: var(--bar-on); }
nav a[aria-current="page"] { color: var(--bar-on); border-bottom-color: var(--bar-mark); font-weight: 600; }
nav a:focus-visible { outline-offset: -3px; outline-color: var(--bar-mark); }
nav .count { min-width: 18px; padding: 0 5px; border-radius: 9px; background: #d64535; color: #fff; font-size: 11.5px; line-height: 18px; text-align: center; font-weight: 600; }
.me { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 13px; }
.me button { all: unset; cursor: pointer; color: var(--bar-on); }
.me button:hover { text-decoration: underline; text-underline-offset: 3px; }
.me button:focus-visible { outline: 2px solid var(--bar-mark); }
main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 64px; }
.head { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 16px; min-height: 34px; }
.head h1 { margin: 0; font-size: 20px; font-weight: 600; }
.head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* 按鈕、表單 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 4px;
       border: 1px solid var(--line-2); background: var(--card); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding: 0 4px; height: auto; }
.btn.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.btn.sm { height: 26px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; filter: none; }
input[type=text], input[type=search], input[type=tel], input[type=number], input[type=date], input[type=month], input[type=time],
input[type=password], input[type=email], select, textarea {
  width: 100%; min-width: 0; height: 32px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--card); }
textarea { height: auto; padding: 7px 9px; resize: vertical; min-height: 84px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 22%, transparent); outline-offset: 0; }
.field { display: grid; gap: 4px; min-width: 0; align-content: start; }
.field > .lab { font-size: 13px; color: var(--ink-2); display: flex; align-items: baseline; gap: 8px; }
.field > .lab em { color: var(--red); font-style: normal; font-size: 12px; }
.field > .lab .hint { color: var(--faint); font-size: 12px; }
.field > .note { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.span2 { grid-column: 1 / -1; }
.stack { display: grid; gap: 14px; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.seg { display: inline-flex; flex-wrap: wrap; }
.seg button { cursor: pointer; height: 30px; padding: 0 12px; border: 1px solid var(--line-2); background: var(--card); margin: 0 0 0 -1px; }
.seg button:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); position: relative; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input[type=search] { flex: 1 1 220px; max-width: 320px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tabs button { cursor: pointer; border: 0; background: none; padding: 7px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button span { color: var(--faint); margin-left: 4px; font-weight: 400; }

/* 表格、區塊 */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
.panel.pad { padding: 14px 16px; }
.block + .block, .panel + .block, .block + .panel { margin-top: 24px; }
h2.sec { font-size: 15px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2.sec .muted { font-weight: 400; font-size: 13px; }
h2.sec .btn { margin-left: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12.5px; padding: 7px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.dim td { color: var(--faint); }
td .sub { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52ch; }
td.right, th.right { text-align: right; }
.table-wrap { overflow-x: auto; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.tag { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; vertical-align: 1px; }
.tag.red { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.tag.amber { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
.tag.green { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
.tag.g6 { color: var(--g6); border-color: color-mix(in srgb, var(--g6) 45%, transparent); }
.tag.g7 { color: var(--g7); border-color: color-mix(in srgb, var(--g7) 45%, transparent); }
.tag.g8 { color: var(--g8); border-color: color-mix(in srgb, var(--g8) 45%, transparent); }
.tag.g9 { color: var(--g9); border-color: color-mix(in srgb, var(--g9) 45%, transparent); }
.tags { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.alert { display: flex; gap: 12px; align-items: center; padding: 9px 14px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 4px; }
.alert + .alert { margin-top: 6px; }
.alert.error { border-left-color: var(--red); }
.alert.warn { border-left-color: var(--amber); }
.alert .body { flex: 1; min-width: 0; }
.alert .acts { display: flex; gap: 6px; flex-wrap: wrap; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.problem { color: var(--red); font-size: 13px; }

/* 右側編輯面板、對話框 */
.scrim { position: fixed; inset: 0; background: rgba(16, 22, 28, .4); z-index: 30; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100vw); background: var(--paper); z-index: 31; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet.narrow { width: min(660px, 100vw); }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0 auto 0 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet-body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; }
.sheet-foot { display: flex; gap: 8px; align-items: center; padding: 10px 20px; background: var(--card); border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet-foot .spacer { flex: 1; }
.x { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); font-size: 22px; line-height: 1; }
.x:hover { background: var(--hover); color: var(--ink); }
.x:focus-visible { outline: 2px solid var(--accent); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.editor > .side-preview { position: sticky; top: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
.card + .card { margin-top: 14px; }
.card > h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.card > h3 .muted { font-weight: 400; font-size: 12.5px; }
.helper { border: 1px dashed var(--line-2); border-radius: 4px; padding: 12px 14px; background: var(--sunk); }
.helper > .lab { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.drop { border: 1px dashed var(--line-2); border-radius: 4px; padding: 10px; display: flex; gap: 12px; align-items: center; background: var(--card); }
.drop.over { border-color: var(--accent); background: var(--accent-weak); }
.drop img { width: 84px; height: 84px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.drop .txt { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dialog { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
          overflow-y: auto; background: var(--card); border-radius: 6px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.dialog.wide { width: min(640px, calc(100vw - 32px)); }
.dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog p { margin: 0; }
.dialog .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(16, 22, 28, .45); }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choices .btn { height: 44px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: #1f2328; color: #fff;
         padding: 9px 16px; border-radius: 4px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.toast.red { background: var(--red); }

/* LINE 預覽 */
.lp { width: 300px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--card); }
.lp .bar { padding: 6px 12px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.lp .chat { background: var(--chat); padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; min-height: 240px; max-height: 520px; overflow-y: auto; }
.lp.tall .chat { height: min(560px, calc(100vh - 250px)); max-height: none; }
.lp .input { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.b { max-width: 88%; padding: 7px 11px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.5;
     background: #fff; color: #111; align-self: flex-start; }
.b.me { background: var(--me); color: #111; align-self: flex-end; }
.b.pic { padding: 3px; }
.b.pic img { display: block; max-width: 180px; max-height: 240px; border-radius: 11px; }
.b.pic .noimg { width: 160px; height: 100px; display: grid; place-items: center; color: #777; font-size: 12px; }
.qr { display: flex; gap: 5px; flex-wrap: wrap; padding: 2px 0 4px; }
.qr button, .qr span { all: unset; cursor: pointer; background: #fff; color: #1d6fd8; border: 1px solid #c8d7ee; border-radius: 999px; padding: 1px 10px; font-size: 12.5px; }
.qr span { cursor: default; }
.sys-note { align-self: center; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 8px; }
.route { align-self: flex-start; font-size: 11.5px; color: var(--muted); margin: -3px 0 2px 4px; }
.samples { display: flex; gap: 6px; flex-wrap: wrap; }
.testgrid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
pre.kb { white-space: pre-wrap; font: 12.5px/1.6 var(--sans); background: var(--sunk); border-radius: 4px; padding: 12px; max-height: 460px; overflow: auto; margin: 10px 0 0; }

/* 週課表 */
.board-wrap { overflow-x: auto; }
.board { display: grid; grid-template-columns: 52px repeat(7, minmax(110px, 1fr)); min-width: 860px; }
.board .dh { text-align: center; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--line-2); background: var(--sunk); }
.board .dh.we { color: var(--muted); }
.board .times { position: relative; border-right: 1px solid var(--line); }
.board .times span { position: absolute; right: 7px; font-size: 11.5px; color: var(--faint); transform: translateY(-50%); }
.board .day { position: relative; border-right: 1px solid var(--line); }
.board .day:last-child { border-right: 0; }
.lesson { position: absolute; border: 0; border-radius: 3px; padding: 3px 6px; overflow: hidden; cursor: pointer; font-size: 12px; line-height: 1.35; color: #fff; text-align: left; }
.lesson b { display: block; font-size: 12.5px; font-weight: 600; }
.lesson:hover { filter: brightness(1.1); }
.lesson.g6 { background: var(--g6); } .lesson.g7 { background: var(--g7); } .lesson.g8 { background: var(--g8); }
.lesson.g9 { background: var(--g9); } .lesson.g0 { background: var(--g0); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.slot { display: grid; grid-template-columns: 110px 1fr 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }

/* 學生、家長、LINE */
.person { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.person:first-of-type { border-top: 0; padding-top: 2px; }
.person .who { display: grid; gap: 3px; }
.line-state { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.code { font-family: var(--mono); letter-spacing: .12em; }
.bigcode { font-family: var(--mono); font-size: 36px; letter-spacing: .2em; font-weight: 700; text-align: center; padding: 12px; border-radius: 4px; background: var(--sunk); }
.results { border: 1px solid var(--line); border-radius: 4px; margin-top: 8px; max-height: 280px; overflow: auto; background: var(--card); }
.results .row { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.results .row:first-child { border-top: 0; }
.results .row .main { flex: 1; min-width: 0; }
.results .row.picked { background: var(--accent-weak); }
.edit-honors td { padding: 5px 6px; }
.pick-bar { display: flex; gap: 8px; }
.picks { border: 1px solid var(--line); border-radius: 4px; overflow-y: auto; min-height: 120px; max-height: min(400px, calc(100vh - 320px)); }
.pick { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; }
.pick + .pick { border-top: 1px solid var(--line); }
.pick.picked { background: var(--accent-weak); }
.pick .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.pick .title { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pick .said { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick.dim .title, .pick.dim .said, .pick.dim .avatar { opacity: .55; }
.avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; object-fit: cover; background: var(--sunk); color: var(--muted); display: grid; place-items: center; font-weight: 600; }
.msg-reply summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.msg-reply pre { white-space: pre-wrap; font: inherit; font-size: 13px; margin: 6px 0 0; padding: 8px 10px; border-radius: 4px; background: var(--sunk); }

/* 登入 */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form { width: min(340px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.login .band { background: var(--bar); color: var(--bar-on); padding: 16px 22px; font-size: 18px; font-weight: 700; letter-spacing: .08em; }
.login .band span { font-weight: 400; font-size: 13px; color: var(--bar-ink); margin-left: 8px; letter-spacing: 0; }
.login .fields { padding: 20px 22px 22px; display: grid; gap: 14px; }
.err { color: var(--red); font-size: 13px; min-height: 1.3em; }

@media (max-width: 960px) {
  .editor, .testgrid { grid-template-columns: minmax(0, 1fr); }

<body>
<div id="root"></div>
<script>
"use strict";
// ======================================================================= 小工具
const SCHOOL = "高明補習班";
const WEEKDAYS = ["", "週一", "週二", "週三", "週四", "週五", "週六", "週日"];
const WEEK1 = "一二三四五六日";
const GRADES = [[6, "國小"], [7, "國一"], [8, "國二"], [9, "國三"]];
const GRADE_LABEL = Object.fromEntries(GRADES);
const STUDENT_STATUS = { active: "在學", paused: "暫停", left: "離班" };
const ENROLL_STATUS = { trial: "試聽", active: "在班", dropped: "退班", finished: "結業" };
const COURSE_STATUS = { open: "開放中", closed: "已結束", archived: "封存" };
const RELATIONS = ["母", "父", "祖父母", "其他"];
const NOTICE_TYPES = { closure: "停課", exam: "考試", event: "活動", enrollment: "招生", general: "一般公告", calendar: "行事曆" };
const FAQ_TYPES = { contact: "聯絡", traffic: "交通", course: "課程", fee: "收費", policy: "規定", enrollment: "招生", other: "其他" };
const MAIN_MENU = ["課程介紹", "行事曆", "榜單", "交通資訊", "聯絡我們", "常見問題"];
const state = { me: null, page: "home", status: null, subjects: [], courses: [] };

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const $ = (sel, root = document) => root.querySelector(sel);
const put = (parent, ...kids) => parent.append(...kids.flat().filter((k) => k != null && k !== false));   // append，但略過 null
const fill = (parent, ...kids) => parent.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));   // 換掉內容，略過 null
const fmtDate = (d) => (d ? String(d).slice(0, 10).replaceAll("-", "/") : "");
const fmtMD = (d) => { if (!d) return ""; const [, m, dd] = String(d).slice(0, 10).split("-").map(Number); return `${m}/${dd}`; };
const fmtTime = (t) => (t ? String(t).slice(0, 5) : "");
const fmtMoney = (n) => (n == null ? "" : Number(n).toLocaleString("en-US") + " 元");
const fmtStamp = (s) => { if (!s) return ""; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const daysLeft = (iso) => Math.round((new Date(iso + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
function weekday(iso) { const d = new Date(iso + "T00:00:00"); return WEEK1[(d.getDay() + 6) % 7]; }
const dayBody = (iso) => (iso ? `${fmtMD(iso)}（${weekday(iso)}）` : "");                      // 10/19（日）
const dayTitle = (iso) => { if (!iso) return ""; const [, m, d] = iso.split("-").map(Number); return `${m}月${d}日（${weekday(iso)}）`; };
const gradeTag = (g, label) => h("span", { class: "tag" + (g >= 6 && g <= 9 ? " g" + g : "") }, label || GRADE_LABEL[g] || "不分年級");
function gradesText(grades) {
  const g = [...new Set(grades || [])].sort((a, b) => a - b);
  if (!g.length || g.join() === "6,7,8,9") return "";
  if (g.join() === "7,8,9") return "國中";
  return g.map((x) => GRADE_LABEL[x]).join("、");
}
const minutes = (t) => { const [hh, mm] = String(t).split(":").map(Number); return hh * 60 + mm; };
function scheduleText(slots) {
  const spans = new Map();
  for (const s of slots) {
    const span = `${fmtTime(s.start_time)}–${fmtTime(s.end_time)}`;
    if (!spans.has(span)) spans.set(span, []);
    spans.get(span).push(WEEKDAYS[s.weekday]);
  }
  return [...spans].map(([span, days]) => `${days.join("、")} ${span}`).join("；") || "沒有上課時段";
}
const valueOrNull = (el) => (el.value.trim() === "" ? null : el.value.trim());
function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch { /* 私密瀏覽 */ } }
const newId = () => (crypto.randomUUID ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));

let toastTimer;
function toast(message, kind = "") {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast " + kind, role: "status" }, message);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), kind === "red" ? 6500 : 2600);
}
function errorMessage(data, status) {
  const d = data && data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d) && d.length) {
    const e = d[0], f = (e.loc || []).slice(-1)[0];
    if (f === "grade" || f === "grades") return "年級只能是國小或國一～國三";
    if (["start_time", "end_time"].includes(f)) return String(e.msg || "").includes("晚於") ? "下課時間要晚於上課時間" : "時間格式不對";
    if (["start_date", "end_date", "joined_on", "left_on", "ends_on"].includes(f)) return "日期格式不對";
    if (f === "fee") return "學費要是 0 以上的數字";
    if (f === "school_year") return "學年度請填數字，例如 115";
    if (f === "body") return "內容太長了";
    return String(e.msg || "資料格式不對").replace(/^Value error, /, "");
  }
  if (status === 413) return "檔案太大了";
  return `發生錯誤（${status}）`;
}
async function api(path, { method = "GET", body } = {}) {
  const res = await fetch("/admin/api" + path, {
    method, credentials: "same-origin",
    headers: body !== undefined ? { "Content-Type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch { /* 沒有內容 */ }
  if (res.status === 401 && path !== "/login") { showLogin(); throw new Error("請先登入"); }
  if (!res.ok) throw new Error(errorMessage(data, res.status));
  return data;
}
async function attempt(fn, okMessage) {
  try {
    const r = await fn();
    if (okMessage) toast(okMessage);
    return r;
  } catch (e) {
    if (e.message !== "請先登入") toast(e.message, "red");
    throw e;
  }
}
function busy(button, fn) {
  return async (...args) => {
    if (button.disabled) return;
    button.disabled = true;
    try { return await fn(...args); } catch (e) { console.warn(e); } finally { button.disabled = false; }
  };
}

// ---- 表單元件
function field(label, input, { required = false, span = false, hint, note } = {}) {
  const tag = ["INPUT", "SELECT", "TEXTAREA"].includes(input.tagName) ? "label" : "div";
  return h(tag, { class: "field" + (span ? " span2" : "") },
    h("span", { class: "lab" }, label, required ? h("em", {}, "必填") : null, hint ? h("span", { class: "hint" }, hint) : null),
    input, note ? h("span", { class: "note" }, note) : null);
}
function seg(options, value, onChange, label) {
  const wrap = h("div", { class: "seg", role: "group", "aria-label": label });
  const buttons = options.map(([v, text]) => h("button", { type: "button", "aria-pressed": String(v === value), onclick: () => {
    buttons.forEach((b, i) => b.setAttribute("aria-pressed", String(options[i][0] === v)));
    onChange(v);
  } }, text));
  wrap.append(...buttons);
  return wrap;
}
function gradePicker(initial, onChange) {
  // 全部年級（空的）或任選幾個年級
  let picked = new Set(initial || []);
  if (picked.size === 4) picked = new Set();
  const wrap = h("div", { class: "seg", role: "group", "aria-label": "適用年級" });
  const all = h("button", { type: "button" }, "全部");
  const buttons = GRADES.map(([g, l]) => h("button", { type: "button", "data-g": g }, l));
  const paint = () => {
    all.setAttribute("aria-pressed", String(picked.size === 0));
    buttons.forEach((b) => b.setAttribute("aria-pressed", String(picked.has(Number(b.dataset.g)))));
  };
  all.addEventListener("click", () => { picked = new Set(); paint(); onChange([]); });
  buttons.forEach((b) => b.addEventListener("click", () => {
    const g = Number(b.dataset.g);
    picked.has(g) ? picked.delete(g) : picked.add(g);
    if (picked.size === 4) picked = new Set();
    paint(); onChange([...picked].sort());
  }));
  wrap.append(all, ...buttons);
  paint();
  return wrap;
}
function select(options, value, attrs = {}) {
  return h("select", attrs, options.map(([v, text]) => h("option", { value: v, selected: String(v) === String(value ?? "") }, text)));
}
function table(headers, rows, emptyText) {
  return h("div", { class: "panel" }, h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, headers.map((t) => (t instanceof Node ? t : h("th", {}, t))))),
    h("tbody", {}, rows.length ? rows : h("tr", {}, h("td", { colspan: headers.length, class: "empty" }, emptyText))))));
}
function clickRow(onOpen, ...cells) {
  return h("tr", { class: "click", tabindex: "0", onclick: onOpen, onkeydown: (e) => { if (e.key === "Enter") onOpen(); } }, cells);
}

// ---- 右側編輯面板、對話框
let sheetOnClose = null;
function openSheet(title, build, { narrow = false, onClose } = {}) {
  closeSheet(false);
  const body = h("div", { class: "sheet-body" });
  const foot = h("div", { class: "sheet-foot hidden" });
  const titleEl = h("h2", { id: "sheet-title" }, title);
  const sheet = h("aside", { class: "sheet" + (narrow ? " narrow" : ""), role: "dialog", "aria-modal": "true", "aria-labelledby": "sheet-title" },
    h("div", { class: "sheet-head" }, titleEl, h("button", { class: "x", "aria-label": "關閉", onclick: () => closeSheet() }, "×")),
    body, foot);
  document.body.append(h("div", { class: "scrim", onclick: () => closeSheet() }), sheet);
  sheetOnClose = onClose || null;
  build(body, foot, titleEl);
  if (foot.children.length) foot.classList.remove("hidden");
  setTimeout(() => (sheet.querySelector("input:not([type=checkbox]):not([type=file]), textarea, select") || sheet.querySelector(".x")).focus?.(), 40);
}
function closeSheet(callback = true) {
  document.querySelectorAll(".scrim, .sheet").forEach((e) => e.remove());
  const cb = sheetOnClose; sheetOnClose = null;
  if (callback && cb) cb();
}
function openDialog(title, build, { wide = false } = {}) {
  closeDialog();
  const box = h("div", { class: "dialog" + (wide ? " wide" : ""), role: "dialog", "aria-modal": "true", "aria-label": title }, h("h2", {}, title));
  document.body.append(h("div", { class: "dialog-scrim", onclick: closeDialog }), box);
  build(box);
  setTimeout(() => (box.querySelector("input:not([type=checkbox]), textarea") || box.querySelector("button"))?.focus(), 30);
}
function closeDialog() { document.querySelectorAll(".dialog, .dialog-scrim").forEach((e) => e.remove()); }
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (document.querySelector(".dialog")) closeDialog();
  else if (document.querySelector(".sheet")) closeSheet();
});

// ---- LINE 預覽：家長在 LINE 上看到的樣子
function preview(items, { title = "LINE 預覽", tall = false } = {}) {
  const chat = h("div", { class: "chat", "aria-live": "polite" });
  const el = h("div", { class: "lp" + (tall ? " tall" : "") }, h("div", { class: "bar" }, title), chat);
  const render = (list) => {
    chat.replaceChildren();
    for (const it of list) chat.append(bubble(it));

}
function bubble(it) {
  if (it.kind === "me") return h("div", { class: "b me" }, it.text);
  if (it.kind === "note") return h("div", { class: "sys-note" }, it.text);

  if (it.kind === "quick") return h("div", { class: "qr" }, it.items.map((q) => it.onClick ? h("button", { type: "button", onclick: () => it.onClick(q) }, q) : h("span", {}, q)));

function showLogin() {
  closeSheet(false); closeDialog();
  const name = h("input", { type: "text", autocomplete: "username", required: true, value: localGet("admin-name") || "" });
  const pw = h("input", { type: "password", autocomplete: "current-password", required: true });
  const err = h("div", { class: "err", role: "alert" });
  const submit = h("button", { class: "btn primary", type: "submit" }, "登入");
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault(); err.textContent = ""; submit.disabled = true;
    try {
      state.me = await api("/login", { method: "POST", body: { name: name.value.trim(), password: pw.value } });
      localSet("admin-name", state.me.name);
      renderShell();
    } catch (ex) { err.textContent = ex.message; } finally { submit.disabled = false; }
  } },
    h("div", { class: "band" }, SCHOOL, h("span", {}, "後台")),
    h("div", { class: "fields" }, field("姓名", name), field("密碼", pw), err, submit));

const PAGES = {
  home: "首頁", notices: "公告", faq: "常見問題", students: "學生", courses: "班級", honors: "榜單",
  broadcast: "廣播", messages: "對話紀錄", test: "機器人測試", settings: "設定",
};
function renderShell() {
  const nav = h("nav", { "aria-label": "主選單" }, Object.entries(PAGES).map(([key, label]) =>
    h("a", { href: "#" + key, "data-page": key }, label, key === "messages" ? h("span", { class: "count hidden", id: "human-count" }) : null)));
  $("#root").replaceChildren(
    h("header", { class: "top" }, h("div", { class: "top-in" },
      h("a", { class: "brand", href: "#home" }, SCHOOL), nav,
      h("div", { class: "me" }, h("span", {}, state.me.name),
        h("button", { type: "button", onclick: async () => { await api("/logout", { method: "POST" }); showLogin(); } }, "登出")))),
    h("main", { id: "main", tabindex: "-1" }));

async function refreshStatus() {
  try {
    state.status = await api("/status");

}

        h("dt", {}, "回答方式"), h("dd", {}, ai.mode === "claude" ? `AI（${ai.model}）` : "關鍵字比對（沒有設定 ANTHROPIC_API_KEY）"),
        h("dt", {}, "傳圖片用的網址"), h("dd", {}, s.public_base || h("span", { class: "st-amber" }, "還不知道（LINE 傳一則訊息進來之後就會知道）")),

};

RENDER.notices = async (main) => {

// ---- 快速填寫：依類型填幾個欄位，自動產生標題和內容
const TEMPLATES = {
  closure: {
    fields: [["date", "停課日期", "date"], ["slot", "時段", ["全天", "下午", "晚上"]], ["reason", "原因", "text", "颱風"], ["makeup", "補課", "text", "補課時間另行通知"]],
    build(v, g) {
      if (!v.date) return null;
      const reason = (v.reason || "").trim();
      const why = reason ? `因${reason}${reason.endsWith("影響") ? "" : "影響"}` : "因故";
      const makeup = (v.makeup || "").trim().replace(/。$/, "");
      return { title: `${reason || "臨時"}停課：${dayTitle(v.date)}${v.slot === "全天" ? "" : v.slot}`,
               body: `${why}，${dayBody(v.date)}${v.slot}${g ? g + "的" : "所有"}課程停課。${makeup ? makeup + "。" : ""}`,
               ends_on: v.date };
    },
  },
  exam: {
    fields: [["exam", "考試", ["段考", "模擬考", "小考", "複習考"]], ["subject", "科目", "text", "", "數學、英文"], ["date", "考試日期", "date"], ["scope", "範圍", "textarea", "", "第 1～3 章"]],
    build(v, g) {
      const title = `${g}${(v.subject || "").replace(/[、,，\s]+/g, "")}${v.exam || "考試"}範圍`;
      const lines = [];
      if (v.date) lines.push(`考試日期：${dayBody(v.date)}`);
      if (v.subject) lines.push(`科目：${v.subject}`);
      if (v.scope) lines.push(`範圍：${v.scope}`);
      return { title, body: lines.join("\n"), ends_on: v.date || null };
    },
  },
  event: {
    fields: [["name", "活動名稱", "text"], ["date", "日期", "date"], ["time", "時間", "text", "", "19:00–20:30"], ["place", "地點", "text"], ["more", "說明", "textarea"]],
    build(v) {
      if (!v.name) return null;
      const lines = [];
      if (v.date) lines.push(`日期：${dayBody(v.date)}`);
      if (v.time) lines.push(`時間：${v.time}`);
      if (v.place) lines.push(`地點：${v.place}`);
      if (v.more) lines.push(v.more);
      return { title: v.name, body: lines.join("\n"), ends_on: v.date || null };
    },
  },
  enrollment: {
    fields: [["name", "名稱", "text"], ["start", "開課日", "date"], ["time", "上課時間", "text", "", "週一到週五 9:00–12:00"], ["fee", "學費", "text", "", "6,000 元"], ["deadline", "報名截止", "date"], ["more", "說明", "textarea"]],
    build(v) {
      if (!v.name) return null;
      const lines = [];
      if (v.start) lines.push(`開課：${dayBody(v.start)}`);
      if (v.time) lines.push(`上課時間：${v.time}`);
      if (v.fee) lines.push(`學費：${v.fee}`);
      if (v.deadline) lines.push(`報名截止：${dayBody(v.deadline)}`);
      if (v.more) lines.push(v.more);
      lines.push("報名請洽櫃台，或點「找真人客服」留言。");
      return { title: v.name, body: lines.join("\n"), ends_on: v.deadline || v.start || null };
    },
  },
  calendar: {
    fields: [["month", "月份", "month"]],
    build(v, g) {
      if (!v.month) return null;
      const m = Number(v.month.split("-")[1]);
      return { title: `${m}月行事曆${g ? `（${g}）` : ""}`, body: null, ends_on: null };
    },
  },
};
const tagFor = (title, grades) => { const t = gradesText(grades); return t && !title.includes(t) ? `（${t}）` : ""; };
function noticeText(category, title, body, grades) {
  const head = `【${title || "（標題）"}】${tagFor(title || "", grades)}`;
  const text = body || "（內容在圖片裡，請看下方圖片）";
  if (category === "closure") return `⚠️ 最新公告\n\n${head}\n${text}`;
  if (category === "calendar") return `📅 行事曆\n\n${head}\n${body || "（行事曆在圖片裡，請看下方圖片）"}`;
  return `📢 公告\n\n${head}\n${text}`;
}
function readFile(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
}
function imagePicker({ current, onChange, aiPurpose, onAiText, disabled }) {
  // current：已經存在的圖片網址；onChange({data, name} | null, removed)
  let src = current || null;
  let lastImage = null;
  const img = h("img", { alt: "預覽", class: src ? "" : "hidden", src: src || undefined });
  const file = h("input", { type: "file", accept: "image/*", class: "hidden" });
  const pick = h("button", { class: "btn sm", type: "button", disabled: !!disabled, onclick: () => file.click() }, src ? "換一張" : "選擇圖片");
  const remove = h("button", { class: "btn sm danger" + (src ? "" : " hidden"), type: "button", onclick: () => {
    src = null; img.classList.add("hidden"); remove.classList.add("hidden"); aiBtn.classList.add("hidden"); pick.textContent = "選擇圖片";
    lastImage = null; onChange(null, true);
  } }, "拿掉圖片");
  const aiOk = state.status?.ai?.vision;
  const aiBtn = h("button", { class: "btn sm hidden", type: "button" }, "用 AI 讀圖上的字");
  aiBtn.addEventListener("click", busy(aiBtn, async () => {
    if (!aiOk) return toast("要先在 .env 設定 ANTHROPIC_API_KEY", "red");
    if (!lastImage) return toast("請先選一張新的圖片", "red");
    aiBtn.textContent = "讀圖中…";
    try {
      const r = await attempt(() => api("/content/read-image", { method: "POST", body: { image: lastImage, purpose: aiPurpose } }));
      onAiText(r.text, r.unclear || []);
    } finally { aiBtn.textContent = "用 AI 讀圖上的字"; }
  }));
  const drop = h("div", { class: "drop" }, img, h("div", { class: "txt" }, pick, remove, aiBtn,
    disabled ? h("span", { class: "small muted" }, disabled) : null), file);
  async function take(f) {
    if (!f || disabled) return;
    if (/heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name)) return toast("iPhone 的 HEIC 照片 LINE 不支援，請改成 JPG 或截圖", "red");
    if (!f.type.startsWith("image/")) return toast("請選圖片檔（JPG、PNG）", "red");
    if (f.size > 20 * 1024 * 1024) return toast("圖片太大了（上限 20MB）", "red");
    const data = await readFile(f);
    lastImage = { data, name: f.name };
    src = data; img.src = data; img.classList.remove("hidden"); remove.classList.remove("hidden"); pick.textContent = "換一張";
    if (aiPurpose && aiOk) aiBtn.classList.remove("hidden");
    onChange(lastImage, false);
  }
  file.addEventListener("change", () => take(file.files[0]));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files[0]); });
  return { el: drop, src: () => src, set(url) { src = url; img.src = url || ""; img.classList.toggle("hidden", !url); remove.classList.toggle("hidden", !url); pick.textContent = url ? "換一張" : "選擇圖片"; } };
}

function editNotice(n, category) {
  const isNew = !n;
  const v = { category: n?.category || category || "general", title: n?.title || "", body: n?.body || "", grades: n?.grades || [],
              ends_on: n?.ends_on || "", image: null, remove_image: false };
  const tpl = {};             // 快速填寫的欄位值
  const touched = { title: !isNew, body: !isNew };
  const typeName = () => (v.category === "calendar" ? "行事曆" : NOTICE_TYPES[v.category]);
  openSheet(isNew ? `新增${typeName()}` : n.title, (body, foot, titleEl) => {
    const title = h("input", { type: "text", value: v.title, maxlength: 60, "aria-label": "標題" });
    const text = h("textarea", { rows: 7, "aria-label": "內容" }, v.body);
    const ends = h("input", { type: "date", value: v.ends_on || "" });
    const prev = preview([]);
    const regenTitle = h("button", { type: "button", class: "btn link small hidden", onclick: () => { touched.title = false; regen(); } }, "重新產生");
    const regenBody = h("button", { type: "button", class: "btn link small hidden", onclick: () => { touched.body = false; regen(); } }, "重新產生");
    const helperBox = h("div");
    function regen() {
      const t = TEMPLATES[v.category];
      const out = t && isNew ? t.build(tpl, gradesText(v.grades)) : null;
      if (out) {
        if (!touched.title && out.title) { title.value = out.title; v.title = out.title; }
        if (!touched.body && out.body != null) { text.value = out.body; v.body = out.body; }
        if (out.ends_on && !ends.dataset.touched) { ends.value = out.ends_on; v.ends_on = out.ends_on; }
      }
      regenTitle.classList.toggle("hidden", !(isNew && t && touched.title));
      regenBody.classList.toggle("hidden", !(isNew && t && touched.body && v.category !== "calendar"));
      paintPreview();
    }
    function paintPreview() {
      const ask = v.category === "calendar" ? "行事曆" : v.category === "closure" ? "課程介紹"
        : (gradesText(v.grades) || "") + ({ exam: "段考範圍", event: "最近有什麼活動", enrollment: "寒假有開班嗎", general: "最新公告" }[v.category] || "");
      const items = [{ kind: "me", text: ask }, { kind: "text", text: noticeText(v.category, v.title, v.body.trim(), v.grades) }];
      const src = picker.src();
      if (src) items.push({ kind: "image", src });
      prev.render(items);
    }
    function drawHelper() {
      const t = TEMPLATES[v.category];
      helperBox.replaceChildren();
      if (!isNew || !t) return;
      const inputs = t.fields.map(([k, label, type, def, ph]) => {
        if (tpl[k] === undefined) tpl[k] = Array.isArray(type) ? type[type.length === 3 ? 2 : 0] : def || "";
        let input;
        if (Array.isArray(type)) input = seg(type.map((o) => [o, o]), tpl[k], (x) => { tpl[k] = x; regen(); }, label);
        else if (type === "textarea") input = h("textarea", { rows: 3, placeholder: ph || "", "aria-label": label, oninput: (e) => { tpl[k] = e.target.value; regen(); } }, tpl[k]);
        else input = h("input", { type, value: tpl[k], placeholder: ph || "", "aria-label": label, oninput: (e) => { tpl[k] = e.target.value; regen(); } });
        return field(label, input, { span: type === "textarea" });
      });
      helperBox.append(h("div", { class: "helper" }, h("div", { class: "lab" }, "快速填寫"), h("div", { class: "grid2" }, inputs)));
    }
    const picker = imagePicker({
      current: n?.image ? "/admin/api/content/image?path=" + encodeURIComponent(n.image) : null,
      aiPurpose: v.category === "calendar" ? "calendar" : "announcement",
      onAiText: (txt, unclear) => {
        if (v.body.trim() && !confirm("用 AI 讀出來的文字取代現在的內容？")) return;
        text.value = txt; v.body = txt; touched.body = true; paintPreview();
        if (unclear.length) toast("看不清楚的地方：" + unclear.join("、") + "，請對照圖片檢查", "red");
      },
      onChange: (img, removed) => { v.image = img; v.remove_image = removed; paintPreview(); },
    });
    title.addEventListener("input", () => { v.title = title.value; touched.title = true; regen(); });
    text.addEventListener("input", () => { v.body = text.value; touched.body = true; regen(); });
    ends.addEventListener("input", () => { v.ends_on = ends.value; ends.dataset.touched = "1"; paintPreview(); });
    const typeSeg = seg(Object.entries(NOTICE_TYPES), v.category, (x) => {
      v.category = x; if (isNew) titleEl.textContent = `新增${typeName()}`; drawHelper(); regen();
    }, "類型");
    const problems = n?.problems?.length ? h("div", { class: "alert error" }, h("div", { class: "body" }, n.problems.join("；"))) : null;
    const draft = n?.draft ? h("div", { class: "alert warn" }, h("div", { class: "body" }, "這段文字是 AI 從圖片讀出來的，請對照圖片檢查後儲存。")) : null;
    body.append(h("div", { class: "editor" },
      h("div", { class: "stack" }, problems, draft,
        field("類型", typeSeg),
        field("年級", gradePicker(v.grades, (g) => { v.grades = g; regen(); })),
        helperBox,
        h("div", { class: "field" }, h("span", { class: "lab" }, "標題", h("em", {}, "必填"), regenTitle), title),
        h("div", { class: "field" }, h("span", { class: "lab" }, v.category === "calendar" ? "文字版" : "內容", v.category === "calendar" ? h("span", { class: "hint" }, "選填") : null, regenBody), text),
        field("圖片", picker.el),
        field("顯示到", ends, { hint: "選填，過了這天自動下架" })),
      h("div", { class: "side-preview" }, prev.el)));
    const save = h("button", { class: "btn primary" }, isNew ? "發布" : "儲存");

        grades: v.grades, ends_on: v.ends_on || null, image: v.image, remove_image: v.remove_image };
      const r = await attempt(() => api("/content/notices/save", { method: "POST", body: payload }));

    }));
    put(foot, save, h("button", { class: "btn", onclick: () => closeSheet() }, "取消"),
      !isNew && n?.key && n.status === "live" ? h("button", { class: "btn", onclick: () => broadcastNotice(n) }, "用 LINE 推播") : null,
      h("span", { class: "spacer" }),

        await attempt(() => api("/content/notices/delete", { method: "POST", body: { key: n.key } }), "已刪除");
        closeSheet(); refreshStatus(); reload();
      } }, "刪除") : null);
    drawHelper(); regen();
  });
}

        style: `top:${(it.start - first) * px + 1}px;height:${Math.max((it.end - it.start) * px - 2, 22)}px;left:calc(${it.lane * w}% + 2px);width:calc(${w}% - 4px)`,
        title: `${it.c.name}　${fmtTime(it.s.start_time)}–${fmtTime(it.s.end_time)}　${it.s.room || ""}`, onclick: () => openCourse(it.c.id) },
        h("b", {}, it.c.name), `${fmtTime(it.s.start_time)}–${fmtTime(it.s.end_time)}`, it.s.room ? ` ${it.s.room}` : "",

RENDER.test = async (main) => {
  const p = preview([{ kind: "note", text: "這裡的訊息不會真的傳出去" }], { title: "測試", tall: true });
  const input = h("input", { type: "text", "aria-label": "測試訊息", maxlength: 500 });
  const log = [];
  async function send(text) {
    text = String(text || "").trim();
    if (!text) return;
    log.filter((x) => x.kind === "quick").forEach((x) => (x.dead = true));
    log.push({ kind: "me", text });
    input.value = "";
    p.render(log.filter((x) => !x.dead));
    try {
      const r = await api("/preview", { method: "POST", body: { text } });
      let quick = [];
      for (const m of r.messages) {
        if (m.type === "image") log.push({ kind: "image", src: m.previewImageUrl });
        else log.push({ kind: "text", text: m.text });
        if (m.quickReply) quick = m.quickReply.items.map((i) => i.action.text);
      }
      if (!r.messages.length) log.push({ kind: "note", text: "（不回覆）" });
      else log.push({ kind: "route", text: `${r.detail?.fallback ? "關鍵字比對" : ROUTE[r.handled_by] || r.handled_by}${r.needs_human ? "，需要真人" : ""}` });
      if (quick.length) log.push({ kind: "quick", items: quick, onClick: send });
    } catch (e) { log.push({ kind: "note", text: e.message }); }
    p.render(log.filter((x) => !x.dead));
  }
  p.el.append(h("form", { class: "input", onsubmit: (e) => { e.preventDefault(); send(input.value); } }, input, h("button", { class: "btn primary sm", type: "submit" }, "送出")));

    h("div", { class: "testgrid" },

          ["國二數學什麼時候上課？", "國二有考試嗎", "國二行事曆", "明天颱風停課嗎", "補習班在哪裡", "學費怎麼繳", "我想看小孩的成績", "家長綁定", "你好"]
